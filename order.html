<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place an Order | Hassan's Grilled Chicken</title>
    <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
    <header>
        <h1>Place Your Order</h1>
        <p>Order your favourite grilled chicken today!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Our Menu</a>
        <a href="order.html">Order Now</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <main>
        <h2>Customer Order Form</h2>

        <form id="orderForm">

            <label for="customerName">Full Name</label>
            <input type="text" id="customerName"
            placeholder="Enter your full name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
            placeholder="Enter your phone number" required>

            <label for="chicken">Choose Your Chicken</label>
            <select id="chicken" required>
                <option value="">Select chicken type</option>
                <option value="Whole Chicken">Whole Chicken</option>
                <option value="Half Chicken">Half Chicken</option>
                <option value="One Piece">One Piece</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity"
            min="1" value="1" required>

            <label for="address">Delivery Location</label>
            <textarea id="address"
            placeholder="Enter your delivery location"
            required></textarea>

            <label for="notes">Additional Instructions</label>
            <textarea id="notes"
            placeholder="Any special requests?"></textarea>

            <button type="submit">Submit Order</button>

        </form>
    </main>

</body>
</html>
